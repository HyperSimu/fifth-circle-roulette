<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五度圏ルーレット</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>五度圏ルーレット</h1>
    <p>緑の外側が長調、赤の内側が短調です</p>
    <div class="circle">
      <div class="disc">
        <div class="ring major-ring"></div>
        <div class="ring minor-ring"></div>
        <div id="major-highlight" class="highlight-sector major-highlight" aria-hidden="true"></div>
        <div id="minor-highlight" class="highlight-sector minor-highlight" aria-hidden="true"></div>
        <div id="images" class="images"></div>
        <div id="majors"></div>
        <div id="minors"></div>
        <div class="center">
          <small>選ばれた調</small>
          <strong id="result">C</strong>
        </div>
      </div>
    </div>
    <button id="spin" type="button">START</button>
    <footer>
      調号画像：Rettinghaus / <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a><br>
      出典：<a href="https://commons.wikimedia.org/" target="_blank">Wikimedia Commons</a>（本アプリ用に改変）
    </footer>
  </main>
  <div id="result-popup" class="result-popup" aria-live="assertive" aria-hidden="true">
    <div class="result-popup-card">
      <small>今日のスケール！</small>
      <div class="popup-key">
        <img id="popup-image" alt="">
        <strong id="popup-result">？</strong>
      </div>
      <div id="popup-info" class="popup-info"></div>
      <button id="reset" type="button">リセット</button>
    </div>
  </div>
  <script>
    // 調の表示データ。順番は五度圏上の時計回りの順番です。
    // 表記や画像ファイル名を変更する場合は、この配列だけを編集します。
    const keys = [
      ['C', 'a', 'C-major_a-minor.svg'], ['G', 'e', 'G-major_e-minor.svg'],
      ['D', 'b', 'D-major_b-minor.svg'], ['A', 'f♯', 'A-major_f-sharp-minor.svg'],
      ['E', 'c♯', 'E-major_c-sharp-minor.svg'], ['B', 'g♯', 'B-major_g-sharp-minor.svg'],
      ['G♭', 'e♭', 'G-flat-major_e-flat-minor.svg'], ['D♭', 'b♭', 'D-flat-major_b-flat-minor.svg'],
      ['A♭', 'f', 'A-flat-major_f-minor.svg'], ['E♭', 'c', 'E-flat-major_c-minor.svg'],
      ['B♭', 'g', 'B-flat-major_g-minor.svg'], ['F', 'd', 'F-major_d-minor.svg']
    ];
    // 画面上の各レイヤーを取得します。
    const majors = document.querySelector('#majors');
    const minors = document.querySelector('#minors');
    const images = document.querySelector('#images');
    const majorHighlight = document.querySelector('#major-highlight');
    const minorHighlight = document.querySelector('#minor-highlight');
    const result = document.querySelector('#result');
    const resultPopup = document.querySelector('#result-popup');
    const popupResult = document.querySelector('#popup-result');
    const popupImage = document.querySelector('#popup-image');
    const popupInfo = document.querySelector('#popup-info');
    const reset = document.querySelector('#reset');
    const spin = document.querySelector('#spin');

    // 調ごとの練習本情報。ページ番号や曲名をここへ入力するとポップアップに表示されます。
    const practiceInfo = {
      C: '3D 18ページ', G: '3D 24ページ', D: '3D 26ページ', A: '3D 28ページ', E: '3D DLC 1ページ', B: '', 'G♭': '3D 22ページ', 'D♭': '3D 20ページ',
      'A♭': '3D 16ページ', 'E♭': '3D 12ページ', 'B♭': '3D 10ページ', F: '3D 14ページ',
      a: '3D 19ページ', e: '3D 25ページ', b: '3D 27ページ', 'f♯': '3D 29ページ', 'c♯': '3D DLC 2ページ', 'g♯': '', 'e♭': '3D 23ページ',
      'b♭': '3D 21ページ', f: '3D 17ページ', c: '3D 13ページ', g: '3D 11ページ', d: '3D 15ページ'
    };
    const majorSound = new Audio('sound/select-maj.mp3');
    const minorSound = new Audio('sound/select-min.mp3');
    const drumrollSound = new Audio('sound/drumroll.mp3');
    const resultSound = new Audio('sound/result.mp3');
    // ドラムロールはシンバルまで含む完成した1回分の音源です。
    drumrollSound.loop = false;
    // 円の中心からの距離を percentage で指定して、調を円周上に配置します。
    // 長調・短調・調号画像の位置を調整するときは、呼び出し側の radius を変更します。
    function position(element, radius, index) {
      element.style.left = `${50 + radius * Math.sin(index * Math.PI / 6)}%`;
      element.style.top = `${50 - radius * Math.cos(index * Math.PI / 6)}%`;
    }
    // 長調、短調、調号画像を12個ずつ生成します。
    keys.forEach((key, index) => {
      const major = document.createElement('button');
      major.className = 'key major-key';
      major.classList.toggle('sharp', key[0].includes('♯'));
      position(major, 28, index);
      major.innerHTML = `<strong>${key[0]}</strong>`;
      major.onclick = () => selectKey(index, false);
      majors.append(major);
      const minor = document.createElement('button');
      minor.className = 'key minor-key';
      minor.classList.toggle('sharp', key[1].includes('♯'));
      position(minor, 18, index);
      minor.innerHTML = `<strong>${key[1]}</strong>`;
      minor.onclick = () => selectKey(index, true);
      minors.append(minor);
      const image = document.createElement('img');
      image.src = `img/${key[2]}`;
      position(image, 42, index);
      images.append(image);
    });
    // 現在のハイライト角度。30度ずつ進めると次の調になります。
    let rotation = 0;

    // 調名と中央の結果表示を更新します。
    function selectKey(index, minor) {
      document.querySelectorAll('.key').forEach((element) => element.classList.remove('selected'));
      (minor ? minors : majors).children[index].classList.add('selected');
      const label = minor ? keys[index][1] : keys[index][0];
      result.textContent = label;
      result.classList.toggle('compact', label.length === 2);
      result.classList.toggle('sharp', label.includes('♯'));
    }

    // 新しい抽選を始める前に、前回の結果と選択状態を消去します。
    function resetSelection() {
      result.textContent = '？';
      result.classList.remove('compact');
      result.classList.remove('sharp');
      resultPopup.classList.remove('visible');
      resultPopup.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('.key').forEach((element) => element.classList.remove('selected'));
      majorHighlight.classList.remove('active');
      minorHighlight.classList.remove('active');
      majorHighlight.style.transform = 'rotate(0deg)';
      minorHighlight.style.transform = 'rotate(0deg)';
      document.querySelector('.disc').classList.remove('major-selected', 'minor-selected');
    }

    reset.onclick = () => {
      resetSelection();
      spin.disabled = false;
      spin.textContent = 'START';
    };
    // STARTボタンは、調性（長調・短調）の決定と調の決定を2段階で行います。
    spin.onclick = () => {
      resetSelection();
      spin.disabled = true;
      spin.textContent = '長調・短調を選択中…';
      const disc = document.querySelector('.disc');
      disc.classList.add('selection-phase');
      // 最初の切り替えで長調側になるよう、短調状態から開始します。
      disc.classList.add('minor-flash');
      let flashes = 0;
      const flashTimer = setInterval(() => {
        const isMinor = disc.classList.toggle('minor-flash');
        const selectionSound = isMinor ? minorSound : majorSound;
        selectionSound.currentTime = 0;
        selectionSound.play().catch(() => { });
        flashes += 1;
        if (flashes >= 8) {
          clearInterval(flashTimer);
          const minor = Math.random() < 0.5;
          disc.classList.remove('selection-phase', 'minor-flash');
          disc.classList.add(minor ? 'minor-selected' : 'major-selected');
          spin.textContent = minor ? '短調に決定' : '長調に決定';
          setTimeout(() => spinKey(minor), 500);
        }
      }, 260);
    };
    function spinKey(minor) {
      spin.textContent = '回転中…';
      drumrollSound.currentTime = 0;
      drumrollSound.play().catch(() => { });
      const index = Math.floor(Math.random() * keys.length);
      rotation += 1800 + (index * 30 - rotation % 360 + 360) % 360;
      const activeHighlight = minor ? minorHighlight : majorHighlight;
      const inactiveHighlight = minor ? majorHighlight : minorHighlight;
      activeHighlight.style.transform = `rotate(${rotation}deg)`;
      inactiveHighlight.style.transform = 'rotate(0deg)';
      activeHighlight.classList.add('active');
      inactiveHighlight.classList.remove('active');
      setTimeout(() => {
        selectKey(index, minor);
        // 円内に結果を表示してから0.8秒待ち、ポップアップと決定音を出します。
        setTimeout(() => {
          popupResult.textContent = result.textContent;
          popupResult.className = result.className;
          popupImage.src = `img/${keys[index][2]}`;
          popupImage.alt = `${result.textContent} の調号`;
          popupInfo.textContent = practiceInfo[result.textContent] || '';
          resultPopup.classList.add('visible');
          resultPopup.setAttribute('aria-hidden', 'false');
          resultSound.currentTime = 0;
          resultSound.play().catch(() => { });
        }, 800);
        spin.disabled = false;
        spin.textContent = 'もう一度回す';
      }, 3200);
    }

    selectKey(0, false);
  </script>
</body>

</html>
